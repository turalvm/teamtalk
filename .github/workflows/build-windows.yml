name: Build Windows 64-bit Client

on:
  push:
    branches: [ "master", "windows", "main" ]
  pull_request:
    branches: [ "master", "windows", "main" ]
  workflow_dispatch:

jobs:
  build-client:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        arch: 'win64_msvc2022_64'
        version: '6.12.0'
        modules: 'qtmultimedia qtspeech'
        setup-python: false
        aqtsource: 'aqtinstall@git+https://github.com/miurahr/aqtinstall.git@master'

    - name: Set up MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MSYS
        path-type: inherit
        update: true
        install: base-devel
        release: false

    - name: Install NASM
      working-directory: ${{runner.workspace}}
      shell: cmd
      run: |
        curl -L -o nasm.zip https://www.nasm.us/pub/nasm/releasebuilds/3.01/win64/nasm-3.01-win64.zip
        7z x nasm.zip
        echo %CD%\nasm-3.01>> %GITHUB_PATH%

    - name: Configure CMake
      run: >-
        cmake -S windows -B output -A x64
        -DCMAKE_CSharp_COMPILER=""
        -DFEATURE_WEBRTC=OFF
        -DBUILD_TEAMTALK_CORE=ON
        -DBUILD_TEAMTALK_CLIENTS=ON
        -DBUILD_TEAMTALK_SERVERS=OFF
        -DBUILD_TEAMTALK_LIBRARIES=OFF
        -DBUILD_TEAMTALK_DOCUMENTATION=OFF

    - name: Build TeamTalk5 Client and Dependencies
      run: |
        cmake --build output --parallel --config Release --target TeamTalk5

    - name: Prepare Complete TeamTalk5 Package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path "TeamTalk5-Windows-x64" -Force
        Copy-Item -Path "windows/Client/qtTeamTalk/TeamTalk5.exe" -Destination "TeamTalk5-Windows-x64/"
        Copy-Item -Path "windows/Client/qtTeamTalk/install.bat" -Destination "TeamTalk5-Windows-x64/" -ErrorAction SilentlyContinue
        Copy-Item -Path "windows/Library/TeamTalk_DLL/*.dll" -Destination "TeamTalk5-Windows-x64/" -ErrorAction SilentlyContinue
        if (Test-Path "windows/Client/qtTeamTalk/windeployqt") {
          Copy-Item -Path "windows/Client/qtTeamTalk/windeployqt/*" -Destination "TeamTalk5-Windows-x64/" -Recurse -Force
        }
        New-Item -ItemType Directory -Path "TeamTalk5-Windows-x64/languages" -Force
        Copy-Item -Path "windows/Client/qtTeamTalk/languages/*.qm" -Destination "TeamTalk5-Windows-x64/languages/" -ErrorAction SilentlyContinue
        if (Test-Path "windows/Setup/Client/Sounds") {
          Copy-Item -Path "windows/Setup/Client/Sounds" -Destination "TeamTalk5-Windows-x64/Sounds" -Recurse -Force
        }
        Get-ChildItem -Path "TeamTalk5-Windows-x64"

    - name: Upload Complete TeamTalk5 Package
      uses: actions/upload-artifact@v4
      with:
        name: TeamTalk5-Windows-x64
        path: TeamTalk5-Windows-x64
